# 1. Clone: git tag or branch to build
git_ref: "1.7"

# 2. Copy: repository folder (source) -> website folder (destination)
documentation_sources:
  - source: src/site/markdown
    destination: .
  - source: diana-api/src/site/markdown
    destination: diana-api
  - source: diana-core/src/site/markdown
    destination: diana-core
  - source: diana-swing/src/site/markdown
    destination: diana-swing
  - source: diana-geom/src/site/markdown
    destination: diana-geom
  - source: diana-geomedit/src/site/markdown
    destination: diana-geomedit
  - source: diana-drawing-editor/src/site/markdown
    destination: diana-drawing-editor
  - source: diana-ppt-editor/src/site/markdown
    destination: diana-ppt-editor
