# 1. Clone: git tag or branch to build
git_ref: "2.4"

# 2. Copy: repository folder (source) -> website folder (destination)
documentation_sources:
  - source: src/site/markdown
    destination: .
  - source: gina-core/src/site/markdown
    destination: gina-core
  - source: gina-swing/src/site/markdown
    destination: gina-swing
  - source: gina-swing-editor/src/site/markdown
    destination: gina-swing-editor
  - source: gina-events/src/site/markdown
    destination: gina-events
  - source: gina-replay/src/site/markdown
    destination: gina-replay
  - source: flexographicutils/src/site/markdown
    destination: flexographicutils
  - source: flexolocalization/src/site/markdown
    destination: flexolocalization

# 4. Latest version: served in site_url/latest/ (one per website)
is_latest: true
