# One file per version, named after it (2.0.yml is the version "2.0" used as folder name).
# The keys follow the steps of the build.

# 1. Clone: git tag or branch to build
git_ref: "2.0"

# 2. Copy: repository folder (source) -> website folder (destination)
documentation_sources:
  - source: docs
    destination: .
  - source: module_a/docs
    destination: module_a

# 3. Menu (optional): pages copied in step 2, written destination/file
#    e.g. module_a/index.md is module_a/docs/index.md in the repository
side_menu:
  - index.md
  - getting_started.md
  - Section name:
    - module_a/index.md
