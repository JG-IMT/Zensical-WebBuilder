# Settings every website starts from. A project overrides them in its website_settings.yml:
# a value replaces the default one, and a list replaces the whole default list.

# A warning (a broken link, for example) stops the build
strict: true
# Text of the footer
copyright: Copyright &copy; 2026 Openflexo.

theme:
  name: material
  # "classic" keeps Material's look (the default is "modern")
  variant: classic
  favicon: favicon.ico
  # Logo of the top bar, the same for every website; a project can replace it
  logo: https://www.openflexo.org/img/logo.png
  features:
    - navigation.top
    - search.suggest
  # Light and dark modes, with a button to switch
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: openflexo/sun
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: openflexo/moon
        name: Switch to light mode

# Style of OpenFlexo (shared/openflexo/style_and_icon/)
extra_css:
  - stylesheets/site_style.css

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - fenced_code

extra:
  # Name and address behind the logo of the top bar, the same for every website
  brand:
    name: Openflexo
    link: https://www.openflexo.org/

  # Links of the top bar, the same for every website; a project can replace them.
  # is_active marks the link of the current section, is_button shows the link as a button
  navbar_links:
    - title: Discover
      link: https://www.openflexo.org/docs/discover/what-is-openflexo
    - title: Get started
      link: https://www.openflexo.org/docs/get-started/
    - title: User guide
      link: https://www.openflexo.org/docs/guide/
    - title: Develop
      link: https://www.openflexo.org/docs/develop/architecture
      is_active: true
    - title: Research
      link: https://www.openflexo.org/docs/research/
    - title: Community
      link: https://www.openflexo.org/docs/community/get-involved
    - title: Downloads
      link: https://www.openflexo.org/downloads
      is_button: true

  # Columns of the footer, the same for every website; a project can replace them
  footer_columns:
    - title: Production tools
      links:
        - title: Jenkins production environment
          link: https://jenkins.openflexo.org/
        - title: Continuous/nightly builds
          link: https://downloads.openflexo.org/openflexo/
        - title: Openflexo artifactory
          link: https://maven.openflexo.org/artifactory
    - title: Generic Components
      links:
        - title: Pamela framework
          link: https://openflexo.org/pamela
        - title: Gina framework
          link: https://openflexo.org/gina
        - title: Diana framework
          link: https://openflexo.org/diana
        - title: Connie framework
          link: https://openflexo.org/connie
    - title: Research
      links:
        - title: Papers
          link: https://www.openflexo.org/docs/research/publications
        - title: AUGMENT project
          link: https://www.openflexo.org/docs/research/projects/augment
        - title: Engineering Digital Twins (EDT)
          link: https://www.openflexo.org/docs/research/projects/edt
        - title: MODES project
          link: https://www.openflexo.org/docs/research/projects/modes
        - title: Formose project
          link: https://www.openflexo.org/docs/research/projects/formose
    - title: Community
      links:
        - title: Contributors
          link: https://www.openflexo.org/docs/community/contributors
        - title: Partners
          link: https://www.openflexo.org/docs/community/partners
        - title: Contact us
          link: mailto:contact@openflexo.org
        # text is shown above the link, is_button shows it as a button, icon is a file of the website
        - title: Create an issue
          link: https://github.com/openflexo-team/website/issues
          text: Something is broken? let us know
          icon: github.svg
          is_button: true
